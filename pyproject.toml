[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MyClaude"
version = "0.1.0"
description = "A staged agent reproduction project with IPC protocol contracts."
readme = "READMME.md"
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=0.105.2,<0.106",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "textual>=0.89,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

#定义命令行入口
[project.scripts]
myclaude = "my_claude.cli.main:main"
myclaude-core = "my_claude.core.app:run"
myclaude-tui = "my_claude.tui.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["my_claude"]
